syntax = "proto3";
package auth;

option go_package = "github.com/victorinolavida/proto/auth";

message RegisterRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string password = 4;
}


message AuthUserResponse {
  string id         = 1;
  string first_name = 2;
  string last_name  = 3;
  string token      = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message WhoamiRequest {
  string user_id = 1;
}

message WhoamiResponse {
  string id         = 1;
  string first_name = 2;
  string last_name  = 3;
  string email = 4;
  int64 session_version = 5;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message ConfirmPasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message PasswordResetResponse {}

service AuthService {
  rpc RegisterUser(RegisterRequest) returns (AuthUserResponse){}
  rpc LoginUser(LoginRequest) returns (AuthUserResponse){}
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse){}
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (PasswordResetResponse){}
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (PasswordResetResponse){}
}
