syntax = "proto3";
package order;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/victorinolavida/proto/order";

message OrderResponse {
  string id = 1; // this is the public id 
  string security_id = 2;
  string direction = 3;
  string order_type = 4;
  string price = 5;
  string yield = 6;
  int64 quantity = 7;
  string nominal_value = 8;
  int64 allocated_quantity = 9;
  string allocation_ptc = 10;
  string allocation_status = 11;
  string fx = 12;
  string status = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message CreateOrderRequest {
  string trader_id = 1;
  string security_id = 2;
  string direction = 3;
  string order_type = 4;
  string price = 5;
  string yield = 6;
  int64 quantity = 7;
}

message CancelOrderRequest {
  string order_group_id = 1;
  string trader_id = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetActiveOrdersRequest {
  string trader_id = 1;
  string security_id = 2;
  string direction = 3;
}

message GetActiveOrdersResponse {
  repeated OrderResponse orders = 1;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse) {}
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse) {}
  rpc GetOrderByID(GetOrderRequest) returns (OrderResponse) {}
  rpc GetActiveOrders(GetActiveOrdersRequest) returns (GetActiveOrdersResponse){}
}
