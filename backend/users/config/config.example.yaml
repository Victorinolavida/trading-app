# Copy this file to config.yaml and adjust the values.
#   cp config/config.example.yaml config/config.yaml
# Every key can be overridden with an env var (DATABASE_HOST, TOKEN_SECRET, ...).

env: development

# Reset is disabled by default. Both providers are development-only.
# mock logs messages; mailpit sends them to the local Mailpit SMTP server.
password_reset:
  enabled: false
  provider: mock
  url: http://localhost:8000/reset-password
  ttl: 30m
  mailpit:
    host: localhost
    port: 1025
    from: noreply@example.com
  # Production SMTP requires STARTTLS and authentication. Supply credentials
  # through your deployment's secret management, not a committed file.
  smtp:
    host: smtp.example.com
    port: 587
    from: noreply@example.com
    username: ""
    password: ""

database:
  user: postgres
  password: postgres
  host: localhost
  port: 5432
  name: trading_users
  min_conns: 2
  max_conns: 2

# must match the gateway token.secret
token:
  secret: change-me-to-a-long-random-secret
  issuer: trading-app
  audience: trading-app-service
  ttl: 10h

grpc:
  protocol: tcp
  host: localhost
  port: 3030
  service: auth
