# Copy this file to config.yaml and adjust the values.
#   cp config/config.example.yaml config/config.yaml
# Every key can be overridden with an env var (DATABASE_HOST, TOKEN_SECRET, ...).

env: development

# Reset is disabled until delivery is configured. The mock is local-only and
# stores messages in memory; it does not deliver email outside the process.
password_reset:
  enabled: false
  provider: mock
  url: http://localhost:8000/reset-password
  ttl: 30m

database:
  user: postgres
  password: postgres
  host: localhost
  port: 5432
  name: trading_users
  min_conns: 2
  max_conns: 2

# must match the gateway token.secret
token:
  secret: change-me-to-a-long-random-secret
  issuer: trading-app
  audience: trading-app-service
  ttl: 10h

grpc:
  protocol: tcp
  host: localhost
  port: 3030
  service: auth
