openapi: 3.0.3
info:
  title: Trading App Gateway API
  description: |
    HTTP API of the gateway. The gateway is a thin BFF: it validates the
    requests and forwards them to the internal services through gRPC.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: health
    description: Liveness endpoint
  - name: auth
    description: Authentication and registration
  - name: orders
    description: Order creation, cancellation and lookup
  - name: securities
    description: Security listings and searches

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                message: ok

  /api/v0/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: jane@example.com
              password: s3cr3t-pass
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: '"email" must be a valid email'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid credentials
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: jane@example.com
              first_name: Jane
              last_name: Doe
              password: s3cr3t-pass
      responses:
        "201":
          description: The created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: '"email" is required, "password" is required'
        "409":
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email already register
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookies
      operationId: logout
      responses:
        "204":
          description: Session cookies cleared

  /api/v0/auth/whoami:
    get:
      tags: [auth]
      summary: Return the authenticated user
      operationId: whoami
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiUser"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid credentials

  /api/v0/orders:
    post:
      tags: [orders]
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              security_id: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
              direction: bid
              order_type: limit
              price: "101.25"
              yield: "3.5"
              quantity: 100
      responses:
        "201":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: '"security_id" must be a valid uuid'
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders/{orderId}/cancel:
    patch:
      tags: [orders]
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
      responses:
        "200":
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders/active:
    get:
      tags: [orders]
      summary: List active orders for a security
      operationId: getActiveOrders
      parameters:
        - name: security_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        - name: direction
          in: query
          required: false
          description: Optional filter; omit to return both directions
          schema:
            type: string
            enum: [bid, ask]
          example: bid
      responses:
        "200":
          description: Active orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetActiveOrdersResponse"
        "400":
          description: security_id is required or direction is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders/{orderId}:
    get:
      tags: [orders]
      summary: Get an order by its public id
      operationId: getOrderByID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/securities:
    get:
      tags: [securities]
      summary: List securities matching the given filters
      operationId: listSecurities
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        - name: ids
          in: query
          required: false
          description: Multiple ids can be provided as repeated query parameters.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: isin
          in: query
          required: false
          schema:
            type: string
          example: US91232E20205D7F9L0P4
        - name: isins
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
          example: Mexico Government Bond
        - name: q
          in: query
          required: false
          schema:
            type: string
          example: mbono
        - name: query
          in: query
          required: false
          schema:
            type: string
          example: mbono
        - name: currency
          in: query
          required: false
          schema:
            type: string
          example: MXN
        - name: serie
          in: query
          required: false
          schema:
            type: string
          example: "341"
        - name: series
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          example: ["341"]
        - name: security_type
          in: query
          required: false
          schema:
            type: string
          example: M
        - name: security_types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          example: ["M", "S"]
        - name: issue_before
          in: query
          required: false
          description: ISO date; only return securities issued before this date.
          schema:
            type: string
            format: date
        - name: issue_after
          in: query
          required: false
          description: ISO date; only return securities issued after this date.
          schema:
            type: string
            format: date
        - name: maturity_before
          in: query
          required: false
          description: ISO date; only return securities maturing before this date.
          schema:
            type: string
            format: date
        - name: maturity_after
          in: query
          required: false
          description: ISO date; only return securities maturing after this date.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Securities matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritiesResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/securities/search:
    get:
      tags: [securities]
      summary: Search securities by free text or exact filters
      operationId: searchSecurities
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        - name: isin
          in: query
          required: false
          schema:
            type: string
          example: US91232E20205D7F9L0P4
        - name: name
          in: query
          required: false
          schema:
            type: string
          example: Mexico Government Bond
        - name: q
          in: query
          required: false
          schema:
            type: string
          example: mbono
        - name: query
          in: query
          required: false
          schema:
            type: string
          example: mbono
        - name: currency
          in: query
          required: false
          schema:
            type: string
          example: MXN
        - name: serie
          in: query
          required: false
          schema:
            type: string
          example: "341"
        - name: security_type
          in: query
          required: false
          schema:
            type: string
          example: M
      responses:
        "200":
          description: Securities matching the search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritiesResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/securities/active:
    get:
      tags: [securities]
      summary: List active securities
      operationId: getActiveSecurities
      responses:
        "200":
          description: Active securities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritiesResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/securities/enabled:
    get:
      tags: [securities]
      summary: List enabled securities
      operationId: getEnabledSecurities
      responses:
        "200":
          description: Enabled securities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritiesResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: ok
      required: [message]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 1
          example: s3cr3t-pass
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        first_name:
          type: string
          minLength: 1
          example: Jane
        last_name:
          type: string
          minLength: 1
          example: Doe
        password:
          type: string
          format: password
          minLength: 1
          example: s3cr3t-pass
      required: [email, first_name, last_name, password]

    AuthUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        token:
          type: string
          description: "JWT access token, sent as `Authorization: Bearer <token>`"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
      required: [user_id, first_name, last_name, token]

    WhoamiUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        token:
          type: string
          description: "JWT access token, sent as `Authorization: Bearer <token>`"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
        email:
          type: string
          format: email
          example: jane@example.com
      required: [user_id, first_name, last_name, token, email]

    CreateOrderRequest:
      type: object
      properties:
        trader_id:
          type: string
          format: uuid
          description: Inferred from the authenticated user when omitted
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        security_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        direction:
          type: string
          enum: [bid, ask]
          example: bid
        order_type:
          type: string
          enum: [limit, market]
          example: limit
        price:
          type: string
          example: "101.25"
        yield:
          type: string
          example: "3.5"
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 100
      required: [security_id, direction, order_type, quantity]

    CancelOrderRequest:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        trader_id:
          type: string
          format: uuid
          description: Inferred from the authenticated user when omitted
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
      required: [order_id]

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          description: Public id of the order
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        security_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        direction:
          type: string
          example: bid
        order_type:
          type: string
          example: limit
        price:
          type: string
          example: "101.25"
        yield:
          type: string
          example: "3.5"
        quantity:
          type: integer
          format: int64
          example: 100
        nominal_value:
          type: string
          example: "1000"
        allocated_quantity:
          type: integer
          format: int64
          example: 0
        allocation_ptc:
          type: string
          example: ""
        allocation_status:
          type: string
          example: pending
        fx:
          type: string
          example: "1"
        status:
          type: string
          example: open
        created_at:
          type: string
          format: date-time
          example: "2026-11-07T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-11-07T00:00:00Z"

    GetActiveOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
      required: [orders]

    SecuritiesResponse:
      type: object
      properties:
        securities:
          type: array
          items:
            $ref: "#/components/schemas/Security"
      required: [securities]

    Security:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        isin:
          type: string
          example: US91232E20205D7F9L0P4
        name:
          type: string
          example: Mexico Government Bond
        security_type:
          type: string
          example: M
        serie:
          type: string
          example: "341"
        issue_date:
          type: string
          format: date
          example: "2026-10-22"
        maturity_date:
          type: string
          format: date
          example: "2033-11-17"
        nominal_value:
          type: number
          format: double
          example: 1000
        currency:
          type: string
          example: MXN
        fx:
          type: number
          format: double
          example: 1
        enable:
          type: boolean
          example: true
      required: [id, isin, security_type, issue_date, maturity_date, nominal_value, currency, fx, enable]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: invalid credentials
      required: [error]
