openapi: 3.0.3
info:
  title: Trading App Gateway API
  description: |
    HTTP API of the gateway. The gateway is a thin BFF: it validates the
    requests and forwards them to the internal services through gRPC.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: health
    description: Liveness endpoint
  - name: auth
    description: Authentication and registration
  - name: orders
    description: Order creation, cancellation and lookup

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                message: ok

  /api/v0/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: jane@example.com
              password: s3cr3t-pass
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: '"email" must be a valid email'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid credentials
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: jane@example.com
              first_name: Jane
              last_name: Doe
              password: s3cr3t-pass
      responses:
        "201":
          description: The created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: '"email" is required, "password" is required'
        "409":
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email already register
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders:
    post:
      tags: [orders]
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              security_id: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
              direction: bid
              order_type: limit
              price: "101.25"
              yield: "3.5"
              quantity: 100
      responses:
        "201":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders/cancel:
    post:
      tags: [orders]
      summary: Cancel an order
      operationId: cancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
            example:
              order_group_id: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
      responses:
        "200":
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: The body could not be parsed or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders/active:
    get:
      tags: [orders]
      summary: List active orders for a security
      operationId: getActiveOrders
      parameters:
        - name: security_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        - name: direction
          in: query
          required: false
          description: Optional filter; omit to return both directions
          schema:
            type: string
            enum: [bid, ask]
          example: bid
      responses:
        "200":
          description: Active orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetActiveOrdersResponse"
        "400":
          description: security_id is required or direction is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v0/orders/{orderId}:
    get:
      tags: [orders]
      summary: Get an order by its public id
      operationId: getOrderByID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: ok
      required: [message]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          minLength: 1
          example: s3cr3t-pass
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        first_name:
          type: string
          minLength: 1
          example: Jane
        last_name:
          type: string
          minLength: 1
          example: Doe
        password:
          type: string
          format: password
          minLength: 1
          example: s3cr3t-pass
      required: [email, first_name, last_name, password]

    AuthUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        token:
          type: string
          description: "JWT access token, sent as `Authorization: Bearer <token>`"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
      required: [user_id, first_name, last_name, token]

    CreateOrderRequest:
      type: object
      properties:
        trader_id:
          type: string
          format: uuid
          description: Inferred from the authenticated user when omitted
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        security_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        direction:
          type: string
          enum: [bid, ask]
          example: bid
        order_type:
          type: string
          enum: [limit, market]
          example: limit
        price:
          type: string
          example: "101.25"
        yield:
          type: string
          example: "3.5"
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 100
      required: [security_id, direction, order_type, quantity]

    CancelOrderRequest:
      type: object
      properties:
        order_group_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        trader_id:
          type: string
          format: uuid
          description: Inferred from the authenticated user when omitted
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
      required: [order_group_id]

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          description: Public id of the order
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        security_id:
          type: string
          format: uuid
          example: 9b2f1a0e-7c3d-4a51-8f2b-0d1e6c5a4b3f
        direction:
          type: string
          example: bid
        order_type:
          type: string
          example: limit
        price:
          type: string
          example: "101.25"
        yield:
          type: string
          example: "3.5"
        quantity:
          type: integer
          format: int64
          example: 100
        nominal_value:
          type: string
          example: "1000"
        allocated_quantity:
          type: integer
          format: int64
          example: 0
        allocation_ptc:
          type: string
          example: ""
        allocation_status:
          type: string
          example: pending
        fx:
          type: string
          example: "1"
        status:
          type: string
          example: open
        created_at:
          type: string
          format: date-time
          example: "2026-11-07T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-11-07T00:00:00Z"

    GetActiveOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
      required: [orders]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: invalid credentials
      required: [error]
